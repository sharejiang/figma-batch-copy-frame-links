<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>批量复制画板链接</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 12px;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      button {
        height: 30px;
        border: none;
        border-radius: 6px;
        padding: 0 10px;
        cursor: pointer;
      }
      .primary {
        background: #0d99ff;
        color: #fff;
      }
      .secondary {
        background: rgba(128, 128, 128, 0.2);
        color: inherit;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        min-height: 36px;
        margin-bottom: 8px;
        white-space: pre-wrap;
      }
      textarea {
        width: 100%;
        height: 180px;
        box-sizing: border-box;
        resize: none;
        border-radius: 6px;
        border: 1px solid rgba(128, 128, 128, 0.45);
        padding: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="actions">
      <button id="copyBtn" class="primary" disabled>复制到剪贴板</button>
      <button id="refreshBtn" class="secondary">刷新</button>
      <button id="closeBtn" class="secondary">关闭</button>
    </div>

    <div id="status" class="status">等待选择 FRAME 或 SECTION...</div>
    <textarea id="output" readonly placeholder="复制结果会显示在这里"></textarea>

    <script>
      const copyBtn = document.getElementById("copyBtn");
      const refreshBtn = document.getElementById("refreshBtn");
      const closeBtn = document.getElementById("closeBtn");
      const statusEl = document.getElementById("status");
      const outputEl = document.getElementById("output");

      let copiedText = "";

      function setResult(data) {
        if (!data.ok) {
          copiedText = "";
          outputEl.value = "";
          copyBtn.disabled = true;
          statusEl.textContent = data.message;
          return;
        }

        copiedText = data.copiedText;
        outputEl.value = copiedText;
        copyBtn.disabled = !copiedText;

        const details = [];
        details.push(`可复制 ${data.count} 项`);
        if (data.ignoredCount > 0) {
          details.push(`已忽略 ${data.ignoredCount} 项（${data.ignoredTypes.join("、")}）`);
        }
        statusEl.textContent = details.join("；");
      }

      async function copyText() {
        if (!copiedText) return;

        try {
          await navigator.clipboard.writeText(copiedText);
          statusEl.textContent = "已复制到剪贴板。";
        } catch (err) {
          outputEl.focus();
          outputEl.select();
          const ok = document.execCommand("copy");
          statusEl.textContent = ok ? "已复制到剪贴板。" : "复制失败，请手动复制文本框内容。";
        }
      }

      window.onmessage = (event) => {
        const msg = event.data && event.data.pluginMessage;
        if (!msg || msg.type !== "result") return;
        setResult(msg);
      };

      copyBtn.addEventListener("click", copyText);
      refreshBtn.addEventListener("click", () => {
        parent.postMessage({ pluginMessage: { type: "refresh" } }, "*");
      });
      closeBtn.addEventListener("click", () => {
        parent.postMessage({ pluginMessage: { type: "close" } }, "*");
      });
    </script>
  </body>
</html>
